# Applies to every Quadlet container unit whose name starts with
# "kamerplanter-", and to no other container on the system: part of
# kamerplanter.target, started only on a checked configuration, restarted
# whenever it exits. Single-value keys such as TimeoutStartSec stay in the
# units, because a drop-in would override a unit's own value.
[Unit]
PartOf=kamerplanter.target
Requires=kamerplanter-config.service
After=kamerplanter-config.service

[Service]
Restart=always

[Install]
WantedBy=kamerplanter.target
