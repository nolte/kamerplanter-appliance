# Applies to every Quadlet container unit whose name starts with
# "kamerplanter-", and to no other container on the system: part of
# kamerplanter.target, started only on a checked configuration, restarted
# whenever it exits. Single-value keys such as TimeoutStartSec stay in the
# units, because a drop-in would override a unit's own value.
#
# The update guard backs up or restores the data volumes before any of these
# containers starts (/usr/bin/kamerplanter-update). The images are bound to
# the system image (/usr/lib/bootc/bound-images.d/): bootc stores them with
# every deployment in /usr/lib/bootc/storage, so a new version starts without
# a registry.
[Unit]
PartOf=kamerplanter.target
Requires=kamerplanter-config.service kamerplanter-update-guard.service
After=kamerplanter-config.service kamerplanter-update-guard.service

[Container]
GlobalArgs=--storage-opt=additionalimagestore=/usr/lib/bootc/storage

[Service]
Restart=always

[Install]
WantedBy=kamerplanter.target
