# /boot is an automount that the base image unmounts after 120 idle seconds.
# A staged release is written to /boot by ostree-finalize-staged.service at
# shutdown; when the maintenance window reboots more than 120 seconds after
# /boot was last used, that service finds the autofs mount point and fails
# with "Remounting /boot read-write: Invalid argument", and the old release
# boots again (#39). /boot stays mounted.
[Automount]
TimeoutIdleSec=0
