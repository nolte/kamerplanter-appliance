# cloud-init's state directory (image/Containerfile). On a bootc system /var
# is not part of the image, so it is created here; seed files go into
# /var/lib/cloud/seed/nocloud/ (spec/distribution-requirements/ L3).
d /var/lib/cloud 0755 root root - -
# Seed files hold the provisioning data, secrets included, in plain text:
# root only, whatever mode they are copied in with.
d /var/lib/cloud/seed 0700 root root - -
# The provisioning layer (spec/distribution-requirements/ L10), root only,
# in place before cloud-init's write_files writes provisioning.env into it;
# /usr/libexec/kamerplanter/provisioning keeps it so.
d /var/lib/kamerplanter/provisioning 0700 root root - -
