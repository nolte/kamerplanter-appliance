# The console messages of the appliance (/run/issue.d/*.issue, written by
# /usr/bin/kamerplanter-update and /usr/libexec/kamerplanter/disks). SELinux
# lets the console (kmscon, agetty) read and the NetworkManager dispatcher
# write that directory only with the type the policy gives it,
# systemd_ssh_issue_var_run_t; created by the tools themselves it inherits
# var_run_t from /run, and the console cannot show what is in it (#23).
# d creates it with the policy's label; Z restores the label of what the disk
# services and the update guard created before this ran (they start right
# after local-fs.target, without waiting for this). What they write into it
# later inherits the type of the directory. The messages that
# console-login-helper-messages moves in from its own directory keep that
# directory's type: kamerplanter-issue-staging.service labels it (#94).
d /run/issue.d 0755 root root - -
Z /run/issue.d - - - - -
