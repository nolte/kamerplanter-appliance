# SSH accepts keys only, never a password (spec/distribution-requirements/
# G3, L5). sshd takes the first value it reads for each keyword, and it reads
# the files here in lexical order before the rest of sshd_config. This file
# therefore wins over 50-cloud-init.conf, which cloud-init rewrites when
# provisioning data sets ssh_pwauth, and over the distribution's files.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin prohibit-password
