# cloud-init on the Kamerplanter appliance (spec/distribution-requirements/
# §L). The stock /etc/cloud/cloud.cfg stays as Fedora ships it, with its full
# module set (L1); this file only narrows what the appliance needs.

# The sources of provisioning data (L2), in the order ds-identify prefers
# them when several are present. NoCloud covers a drive labelled CIDATA and a
# seed URL (ds=nocloud;s=… on the kernel command line or in the SMBIOS serial
# number). Hetzner reads the metadata service of Hetzner Cloud. OVHcloud
# Public Cloud runs on OpenStack and serves its metadata through the OpenStack
# metadata service; ConfigDrive reads the config-2 drive that OpenStack and
# OVHcloud's "Bring Your Own Image" attach instead. None comes last as the
# fallback that cloud-init requires; without any detected source the
# generator keeps cloud-init disabled (L4).
# Seed files under /var/lib/cloud/seed/nocloud/ need a file of the user's
# that sets "datasource_list: [ NoCloud, None ]" (L3); the image must not
# ship it. ds-identify reads this key only as a single line.
datasource_list: [ NoCloud, ConfigDrive, Hetzner, OpenStack, None ]

# Provisioned SSH keys are authorised for root, and no default user is
# created, Fedora's "fedora" included (L5). A null default_user also keeps
# a "users: [ default ]" in user-data from creating it.
users: []
disable_root: false
system_info:
  default_user: null

# No password login over SSH (G3, L5). User-data can set ssh_pwauth to true;
# /etc/ssh/sshd_config.d/10-kamerplanter.conf keeps it refused regardless.
ssh_pwauth: false

# Partitions and file systems are not grown (L7); both modules stay in the
# module lists. The root file system is composefs, which resizefs cannot
# grow anyway; growing the data location belongs to E3 and deployment-targets
# H8.
growpart:
  mode: "off"
resize_rootfs: false
