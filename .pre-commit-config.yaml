# See https://pre-commit.com for usage and config reference.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents, --unsafe]
      - id: check-json
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-added-large-files

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [-d, relaxed]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        # The repository's own shell scripts (the workflows' shared checks in
        # .github/scripts/ among them), including the first-boot
        # configuration and update scripts that ship without a file extension.
        # -x follows the shared configuration parser they source.
        files: '^(\.github/scripts/.*\.sh|build/.*\.sh|scripts/.*\.sh|tests/.*\.sh|image/rootfs/usr/(libexec/kamerplanter/.*|lib/kamerplanter/.*\.sh|bin/kamerplanter-.*|lib/systemd/system-generators/kamerplanter-.*))$'
        types: [file]
        args: [-x]

  - repo: local
    hooks:
      # Fedora deletes superseded digests of its quay.io images within about
      # a day, so a base pinned there stops resolving (#42, #48). Every Fedora
      # base builds from the project's mirror (.github/workflows/base-image-mirror.yml).
      - id: fedora-base-from-mirror
        name: Fedora bases build from the base image mirror
        language: pygrep
        # A FROM line, a COPY --from, or an ARG default (quoted or not) that a
        # FROM ${...} would use; on quay.io/fedora, registry.fedoraproject.org,
        # or a short name (fedora, fedora-bootc) that podman resolves there.
        entry: '^\s*(FROM\s+(--\S+\s+)*|COPY\s+(--\S+\s+)*--from=|ARG\s+\w+=["'']?)(quay\.io/fedora/|registry\.fedoraproject\.org/|fedora(-bootc)?(:|@|\s|$))'
        args: [--ignore-case]
        files: '(^|/)([^/]*\.)?(Containerfile|Dockerfile)(\.[^/]*)?$'

      # A find read through a process substitution loses its exit status, so
      # a directory it could not read passes for an empty one (#119, #149).
      # The shipped scripts read a search through list (mapfile, then
      # wait "$!"; /usr/lib/kamerplanter/env.sh). This refuses that one form
      # only, on one line; the hook below refuses the command substitution.
      - id: no-find-in-process-substitution
        name: No find in a process substitution in the image's scripts
        language: pygrep
        entry: '<\(\s*(cd\s[^)]*&&\s*)?find\s'
        files: '^image/rootfs/usr/(libexec/kamerplanter/.*|lib/kamerplanter/.*\.sh|bin/kamerplanter-.*|lib/systemd/system-generators/kamerplanter-.*)$'
        types: [file]

      # In a command substitution find's exit status is lost the same way:
      # [ -n "$(find DIR ...)" ] is false for a directory that could not be
      # read as for an empty one, and "|| true" inside drops it on purpose
      # (#169). The shipped scripts read a search through list. This refuses
      # a find anywhere inside "$(" up to the first ")", on one line, also in
      # a comment, and also the assignment alone (x=$(find ...) || ...), which
      # would keep the status: list reads it the same and needs no exception
      # here. A find in a pipe, in backticks, behind a function or a variable,
      # or after an earlier ")" in the same substitution is not seen; the
      # scripts outside the image (tests/boot/results.sh assigns alone) are
      # not checked.
      - id: no-find-in-command-substitution
        name: No find in a command substitution in the image's scripts
        language: pygrep
        entry: '\$\([^)]*\bfind\s'
        files: '^image/rootfs/usr/(libexec/kamerplanter/.*|lib/kamerplanter/.*\.sh|bin/kamerplanter-.*|lib/systemd/system-generators/kamerplanter-.*)$'
        types: [file]

      # A rename onto a name that is a directory moves the file into that
      # directory and succeeds: the write is reported, the file not replaced
      # (#144, #162). The shipped scripts rename with "mv -fT -- " (replace in
      # /usr/lib/kamerplanter/env.sh for a file's content). The one
      # "mv -nT -- " is that of the pin key in configure, where the first
      # writer must win and the caller reads the key again: -n skips an
      # existing name with success, so it replaces nothing. This refuses
      # every other mv, on one line, comment lines aside (a mv named in a
      # comment after code is refused too: reword it); cp, install and ln
      # onto such a name, and a mv behind a variable or in quotes, are not
      # seen.
      - id: no-rename-into-a-directory
        name: No mv without -T in the image's scripts
        language: pygrep
        entry: '^(?!\s*#)(.*[^\w-])?mv\s(?!-fT -- |-nT -- "\$tmp" "\$pin_key" )'
        files: '^image/rootfs/usr/(libexec/kamerplanter/.*|lib/kamerplanter/.*\.sh|bin/kamerplanter-.*|lib/systemd/system-generators/kamerplanter-.*)$'
        types: [file]
