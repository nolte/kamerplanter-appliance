name: vm-tests

# Runs the QEMU VM tests of tests/boot/ on GitHub-hosted runners: the boot
# matrix (`task test:boot`), the update and rollback chains (`task
# test:update`) and the data-disk chains (`task test:data-disk`). The scripts
# are the ones the Taskfile targets run, in the same tool container
# (build/in-tools.sh), so a local run and a run here test the same way.
#
# One job builds the system image and the development disk once; every test
# job loads exactly that image, so all of them test the same digest. The
# ports of a test VM are fixed (10022, 18000, 18080), so each job runs one VM
# at a time; chains whose steps share a running VM or a disk stay in one job.
#
# The jobs are not required checks themselves: on a pull request they run
# only with the label `vm-tests`, after a merge to develop when the image, the
# build or the tests change, and by hand. What a pull request must pass is the
# commit status vm-gate (.github/workflows/vm-gate.yml): a change to what
# these tests cover needs the label and their green result (#43). The result
# goes into vm-gate from .github/workflows/vm-gate-finalize.yml, which reads
# the jobs of this run once it has completed and runs as develop has it; no
# job here writes a commit status, since this workflow runs as the pull
# request has it (#51).
#
# The label is the consent to running one head, and vm-gate.yml takes it
# away again on a push that changes what these jobs run and when it was set
# too soon after someone else's push (#130, #151). The event that starts a
# run is older than that decision, so the first job, consent, asks the API
# before anything is built (#152): the build starts only if the pull
# request has the label and vm-gate has accepted the head, and the run ends
# if the label was removed after the run's event. This saves the runners of a
# head nobody consented to; it protects nothing, since a pull request can
# rewrite this file. What protects the result is vm-gate-finalize.yml, which
# counts none of a commit vm-gate did not accept. The job decides once: a
# run that it let through is not stopped when the label goes afterwards.
# That happens without anyone's doing when a label is set a second after a
# push, so that the push's event already holds it: vm-gate.yml sets pending
# from the push's run, consent sees it, and the label's run takes it back
# seconds later (the header of vm-gate.yml). The suites then run that head
# to the end without a result that counts (#180).

on:
  workflow_dispatch:
    inputs:
      suites:
        description: "Which tests to run"
        required: true
        type: choice
        default: all
        options: [all, boot, update, data-disk]
  pull_request:
    branches: [develop]
    types: [labeled, synchronize]
  push:
    branches: [develop]
    paths:
      - 'image/**'
      - 'build/**'
      - 'tests/boot/**'
      - 'tests/image/**'
      - '.github/workflows/vm-tests.yml'

permissions:
  contents: read

# A newer push to a pull request supersedes the running tests. Label events
# never cancel: opening a pull request with several labels fires one labeled
# event per label at the same moment, and a cancelling event in the same group
# would stop the run that the vm-tests label started. Adding any other label
# gets a group of its own, so it neither starts tests nor waits for them.
# Every merge to develop gets a group of its own and is never cancelled, so
# each merge has a result.
concurrency:
  group: >-
    vm-tests-${{ github.event_name }}-${{ github.ref }}-${{
    (github.event_name == 'push' && github.sha) ||
    (github.event.action == 'labeled' && github.event.label.name != 'vm-tests' && github.run_id) ||
    'latest' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' }}

env:
  TOOLS_IMAGE: kamerplanter-appliance-tools:poc
  IMAGE_REF: localhost/kamerplanter-appliance:poc

jobs:
  # Whether this run still has the consent it started with (#152). The
  # condition sorts out, without a runner, the events that never start the
  # tests: a push that found no label, and another label that was added.
  # The script then reads the live state, for a pull request only:
  #   - the label vm-tests, from the API;
  #   - whether it was removed after this run's event (the pull request's
  #     events): the run of a push whose label vm-gate.yml withdrew ends
  #     also when the label is set again before this job looks, because
  #     setting it starts a run of its own, and only that one tests the
  #     head; the same for the run of a label that was removed again;
  #   - vm-gate's newest status of the head since the event: pending, green
  #     or a result of the VM tests, which are the states on which
  #     vm-gate-finalize.yml writes a result. vm-gate.yml decides some
  #     seconds after the event (measured on #174 to #177: 5 to 10 s), so
  #     the job asks again every 10 s until the label is gone or the head
  #     is accepted. An older status does not count: on a commit that was
  #     the head before, it is from before this event.
  # No decision after about 10 minutes (vm-gate.yml refused the head and
  # left the label, its run was dropped, it was late, or the API does not
  # answer) fails the job, and the tests do not run: remove the label and
  # set it again, which starts a new run (setting a label that is still
  # there starts nothing), or, if vm-gate has accepted the head by now, run
  # the failed jobs again. The time compared with is the pull request's
  # `updated_at` in the event, GitHub's own record: never later than the
  # event itself, and a label change sets it (measured on #179), so it is
  # not earlier than a removal before the label of this event. The script
  # prints it, and fails at once when the event has none: every status
  # would count as new and every removal as one after the event. It also
  # fails at once when vm-gate.yml says that the commit is not the head of
  # the pull request any more, which no later run of it takes back for
  # this event; its other refusals can be followed by pending (another
  # label's run before the run of vm-tests' own event), so the job waits.
  #
  # The job ends green when the consent is gone, and every later job is
  # skipped: vm-gate-finalize.yml reads a skipped build as a run that tested
  # nothing and leaves vm-gate as vm-gate.yml set it. The token only reads
  # (the labels and events of the pull request, the statuses of the head),
  # as it does for a pull request from a fork; no code is checked out.
  # tests/unit/vm-gate.sh runs the script against a stub of gh.
  consent:
    name: consent
    if: >-
      github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'vm-tests') &&
      (github.event.action != 'labeled' || github.event.label.name == 'vm-tests'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pull-requests: read
      statuses: read
    outputs:
      run: ${{ steps.consent.outputs.run }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      EVENT: ${{ github.event_name }}
      NUMBER: ${{ github.event.pull_request.number }}
      SHA: ${{ github.event.pull_request.head.sha }}
      SINCE: ${{ github.event.pull_request.updated_at }}
    steps:
      - name: Read the label vm-tests and vm-gate's status of the head
        id: consent
        run: |
          set -euo pipefail
          decide() {  # decide true|false REASON
            echo "vm-tests: $2"
            echo "run=$1" >>"$GITHUB_OUTPUT"
            [ "$1" = true ] || echo "The VM tests did not run: $2." >>"$GITHUB_STEP_SUMMARY"
            exit 0
          }
          [ "$EVENT" = pull_request ] || decide true "a run on $EVENT needs no label"
          if [ -z "$SINCE" ]; then
            echo "::error::the event of this run names no time of the pull request (updated_at), so a status or a removal cannot be told from an older one: the VM tests do not run."
            exit 1
          fi

          echo "vm-tests: the event of this run is from $SINCE"
          waited="no answer from the API"
          for try in $(seq "${VM_TESTS_TRIES:-60}"); do
            [ "$try" = 1 ] || sleep "${VM_TESTS_PAUSE:-10}"
            # Whether the pull request has the label right now.
            has=$(gh api "repos/$REPO/issues/$NUMBER/labels?per_page=100" \
              --jq '[.[].name] | index("vm-tests") != null') || continue
            [ "$has" = true ] || decide false "#$NUMBER does not have the label vm-tests any more"
            # Whether the label was removed after this run's event, on
            # whichever page of the events that is. Later, not at the same
            # second: a label that is removed and set at once has the time
            # of the event that set it.
            removed=$(gh api --paginate "repos/$REPO/issues/$NUMBER/events?per_page=100" |
              jq -rs --arg since "$SINCE" '[.[][] | select(.event == "unlabeled" and .label.name == "vm-tests"
                and .created_at > $since)] | length > 0') || continue
            [ "$removed" != true ] ||
              decide false "the label vm-tests was removed from #$NUMBER after this run's event, which ends the consent this run started with; setting the label again starts a run of its own"
            # vm-gate's newest status of the head since the event, as
            # "state<TAB>description". Every page of the list, newest first:
            # the status can sit behind 100 newer ones of other contexts.
            gate=$(gh api --paginate "repos/$REPO/commits/$SHA/statuses?per_page=100" |
              jq -rs --arg since "$SINCE" '[.[][] | select(.context == "vm-gate" and .created_at >= $since)] | first
                | if . == null then "no status since the event" else "\(.state)\t\(.description // "")" end') || continue
            # What vm-gate-finalize.yml writes a result on.
            case $gate in
              pending$'\t'* | success$'\t'* | failure$'\t''the VM tests of this commit'*)
                decide true "#$NUMBER has the label vm-tests, and vm-gate has accepted this commit" ;;
              failure$'\t''no VM test result for this commit: it is not the head of the pull request any more')
                echo "::error::this commit is not the head of #$NUMBER any more (vm-gate): the VM tests do not run."
                exit 1 ;;
            esac
            waited="vm-gate: ${gate//$'\t'/: }"
          done
          echo "::error::vm-gate has not accepted this commit for the VM tests ($waited): the VM tests do not run. Remove the label vm-tests and set it again, or run the failed jobs again once vm-gate has accepted the commit."
          exit 1

  build:
    name: build
    needs: consent
    if: needs.consent.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Disk before the run
        run: df -h /

      - name: Build the tool container
        run: docker build -t "$TOOLS_IMAGE" -f build/tools.Containerfile build

      # The same command as `task image:build`: a development build, labelled
      # with the commit that is built.
      - name: Build the system image
        run: |
          set -euo pipefail
          # The tool container writes as root; the directory stays the
          # runner's, so the archives can be written next to its files.
          mkdir -p .build/ci
          revision=$(git rev-parse HEAD)
          created=$(TZ=UTC0 git show -s --date=format-local:%Y-%m-%dT%H:%M:%SZ --format=%cd HEAD)
          build/in-tools.sh podman build \
            --build-arg REVISION="$revision" --build-arg CREATED="$created" \
            --annotation org.opencontainers.image.version=dev \
            --annotation org.opencontainers.image.revision="$revision" \
            --annotation org.opencontainers.image.created="$created" \
            -t "$IMAGE_REF" image

      # spec/distribution-requirements/ L16: the metadata rules of the image,
      # loaded with its own nft in a container without a network of its own.
      - name: Check the metadata rules
        run: build/in-tools.sh tests/image/metadata-guard.sh "$IMAGE_REF"

      - name: Build the development disk
        run: build/in-tools.sh build/disk.sh "$IMAGE_REF"

      - name: Pack the tool container, the system image and the disk
        run: |
          set -euo pipefail
          docker save "$TOOLS_IMAGE" | zstd -T0 -3 -q -o .build/ci/tools.tar.zst
          build/in-tools.sh podman save -o .build/ci/system-image.tar "$IMAGE_REF"
          zstd -T0 -3 -q --rm .build/ci/system-image.tar
          zstd -T0 -3 -q .build/disk.raw -o .build/ci/disk.raw.zst
          ls -lh .build/ci

      - name: Record the image under test
        run: |
          set -euo pipefail
          id=$(build/in-tools.sh podman image inspect --format '{{.Id}}' "$IMAGE_REF")
          {
            echo "### Image under test"
            echo
            echo "- commit: \`$(git rev-parse HEAD)\`"
            echo "- \`$IMAGE_REF\` image ID: \`$id\`"
          } >>"$GITHUB_STEP_SUMMARY"

      # Run-scoped intermediates for the test jobs below; never published.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vm-tools-image
          path: .build/ci/tools.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vm-system-image
          path: .build/ci/system-image.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vm-disk
          path: .build/ci/disk.raw.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Disk after the run
        if: always()
        run: df -h /

  # tests/boot/run.sh: runs 7 and 8 need the running VM of run 1, run 5 its
  # disk and run 6 the running VM of run 5, so they stay with run 1. Runs 9
  # to 12 boot with provisioning data (NoCloud drive, seed URL); 10 to 12
  # wait only for SSH and cloud-init, so they share a job.
  boot:
    name: boot (${{ matrix.name }})
    needs: build
    if: contains(fromJSON('["all", "boot"]'), inputs.suites || 'all')
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: runs 1 7 8 5 6
            id: run1
            runs: 1 7 8 5 6
          - name: run 2
            id: run2
            runs: '2'
          - name: run 3
            id: run3
            runs: '3'
          - name: run 4
            id: run4
            runs: '4'
          - name: run 9
            id: run9
            runs: '9'
          - name: runs 10 11 12
            id: run10
            runs: 10 11 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Give the runner user access to KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vm-tools-image
          path: .build/ci

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vm-disk
          path: .build/ci

      - name: Load the tool container and the disk
        run: |
          set -euo pipefail
          zstd -dc .build/ci/tools.tar.zst | docker load
          zstd -d -q --sparse --rm .build/ci/disk.raw.zst -o .build/disk.raw
          rm -f .build/ci/tools.tar.zst
          df -h /

      - name: Run the boot tests
        env:
          RUNS: ${{ matrix.runs }}
        run: |
          read -ra args <<<"$RUNS"
          build/in-tools.sh tests/boot/run.sh "${args[@]}"

      - name: Check the results
        if: always()
        run: tests/boot/results.sh .build/boot/results.tsv

      # Results, serial consoles and diagnoses only: never the SSH key next to them.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: vm-results-boot-${{ matrix.id }}
          path: |
            .build/boot/*.tsv
            .build/boot/*.serial.log
            .build/boot/*.diagnose.txt
            .build/boot/*.console.txt
            .build/boot/*.update-log.txt
            .build/boot/*.screen*.ppm
          if-no-files-found: warn
          retention-days: 14

  # tests/boot/update.sh: window, signature, forward and manual continue on
  # one running VM; auto and uefi need only the installed disk.
  update:
    name: update (${{ matrix.name }})
    needs: build
    if: contains(fromJSON('["all", "update"]'), inputs.suites || 'all')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: window to manual
            id: a
            steps: install window signature forward manual
          - name: auto
            id: b
            steps: install auto
          - name: uefi
            id: c
            steps: install uefi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Give the runner user access to KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vm-tools-image
          path: .build/ci

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vm-system-image
          path: .build/ci

      - name: Load the tool container and the system image
        run: |
          set -euo pipefail
          zstd -dc .build/ci/tools.tar.zst | docker load
          zstd -d -q --rm .build/ci/system-image.tar.zst
          build/in-tools.sh podman load -q -i .build/ci/system-image.tar
          build/in-tools.sh podman image exists "$IMAGE_REF"
          rm -f .build/ci/tools.tar.zst .build/ci/system-image.tar
          df -h /

      - name: Run the update tests
        env:
          STEPS: ${{ matrix.steps }}
        run: |
          read -ra args <<<"$STEPS"
          build/in-tools.sh tests/boot/update.sh "${args[@]}"

      - name: Check the results
        if: always()
        run: tests/boot/results.sh .build/boot/update-results.tsv

      # Results, serial consoles and diagnoses only: the run's signing keys and their
      # passphrases lie in .build/update and stay there.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: vm-results-update-${{ matrix.id }}
          path: |
            .build/boot/*.tsv
            .build/boot/*.serial.log
            .build/boot/*.diagnose.txt
            .build/boot/*.update-log.txt
            .build/boot/*.mount-state.txt
            .build/boot/*.disk.log
          if-no-files-found: warn
          retention-days: 14

  # tests/boot/data-disk.sh: every chain builds the release and its disk
  # (build) and takes the baseline of SELinux denials (none) itself; move
  # continues on the running VM of none; replace, missing, downgrade and backup
  # need the data disk and the login of data, and retire the backup disk of
  # backup. downgrade boots the development
  # disk of the build job.
  data-disk:
    name: data-disk (${{ matrix.name }})
    needs: build
    if: contains(fromJSON('["all", "data-disk"]'), inputs.suites || 'all')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: move
            id: move
            steps: build none move
            dev-disk: false
          - name: data to backup
            id: data
            steps: build none data replace missing backup retire
            dev-disk: false
          - name: downgrade
            id: downgrade
            steps: build none data downgrade
            dev-disk: true
          - name: luks
            id: luks
            steps: build none luks
            dev-disk: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Give the runner user access to KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vm-tools-image
          path: .build/ci

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vm-system-image
          path: .build/ci

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: matrix.dev-disk
        with:
          name: vm-disk
          path: .build/ci

      - name: Load the tool container, the system image and the disk
        run: |
          set -euo pipefail
          zstd -dc .build/ci/tools.tar.zst | docker load
          zstd -d -q --rm .build/ci/system-image.tar.zst
          build/in-tools.sh podman load -q -i .build/ci/system-image.tar
          build/in-tools.sh podman image exists "$IMAGE_REF"
          if [ -f .build/ci/disk.raw.zst ]; then
            zstd -d -q --sparse --rm .build/ci/disk.raw.zst -o .build/disk.raw
          fi
          rm -f .build/ci/tools.tar.zst .build/ci/system-image.tar
          df -h /

      - name: Run the data-disk tests
        env:
          STEPS: ${{ matrix.steps }}
        run: |
          read -ra args <<<"$STEPS"
          build/in-tools.sh tests/boot/data-disk.sh "${args[@]}"

      - name: Check the results
        if: always()
        run: tests/boot/results.sh .build/boot/data-disk-results.tsv

      # Results, serial consoles and diagnoses only: the login token and the disks lie
      # in .build/data-disk and stay there.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: vm-results-data-disk-${{ matrix.id }}
          path: |
            .build/boot/*.tsv
            .build/boot/*.serial.log
            .build/boot/*.diagnose.txt
            .build/boot/*.update-log.txt
            .build/boot/*.avc*.txt
            .build/boot/*.console.txt
            .build/boot/*.disk.log
          if-no-files-found: warn
          retention-days: 14

      - name: Disk after the run
        if: always()
        run: df -h /

  report:
    name: report
    needs: [build, boot, update, data-disk]
    if: always() && needs.build.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: vm-results-*
          path: results

      - name: Write the results into the summary
        run: tests/boot/results.sh --summary results >>"$GITHUB_STEP_SUMMARY"
