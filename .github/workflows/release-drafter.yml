on:
  push:
    branches: [develop]
  # A merge pushed with GITHUB_TOKEN triggers no downstream workflow (GitHub's
  # loop guard), so the draft is not regenerated after such a bot merge. This
  # lets an operator run the drafter by hand:
  #   gh workflow run release-drafter.yml --ref develop
  workflow_dispatch:

jobs:
  update_release_draft:
    uses: nolte/gh-plumbing/.github/workflows/reusable-release-drafter.yml@9048eafc8665611b8109e8c5a519b78e0fceffa6 # v2.2.1
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
      pull-requests: write
