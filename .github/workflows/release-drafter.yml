on:
  push:
    branches: [develop]
  # A merge pushed with GITHUB_TOKEN triggers no downstream workflow (GitHub's
  # loop guard), so the draft is not regenerated after such a bot merge. This
  # lets an operator run the drafter by hand:
  #   gh workflow run release-drafter.yml --ref develop
  workflow_dispatch:

jobs:
  update_release_draft:
    uses: nolte/gh-plumbing/.github/workflows/reusable-release-drafter.yml@a4655795b1c9927947db97467d30d9e7c5868384 # v2.4.0
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
      pull-requests: write
