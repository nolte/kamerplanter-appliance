name: Release Publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (must match an open release-drafter draft)."
        required: true
        type: string
      dry_run:
        description: "Validate every gate but do not flip draft -> published."
        required: false
        type: boolean
        default: false

# Builds the disk image, attaches it to the draft release, then calls the
# canonical reusable in nolte/gh-plumbing, which resolves the draft, verifies
# version-bearing-file alignment and the `chore(release): <tag>` commit, and
# flips draft -> published. See spec/release-distribution/ in this repository
# and spec/project/release-automation/ in nolte/claude-shared.
#
# Order of the jobs:
#   prepare  cheap checks first: dispatched on develop, the tag is an open
#            draft, and either the draft has no assets yet or they were built
#            from the commit develop is at now
#   disk     builds the disk image from exactly that commit (skipped when the
#            draft already carries it, because a rebuild is not bit-identical);
#            outside a dry run it first pushes the system image to ghcr.io
#            under the tag, signed with the appliances' update key
#   assets   signs the disk image, SHA256SUMS and the system image keylessly
#            with this workflow's identity, records build provenance, verifies
#            all of it, and attaches disk image, checksums, signature bundles,
#            the system image reference and the source commit to the
#            still-draft release; publishing makes the release immutable
#            (enabled for this repository) and cascades at once to
#            release-cd-refresh-master.yml and release-cd-deliver-docs.yml
#   current  confirms develop has not moved while the image was built, so the
#            tag the reusable creates on develop matches the attached image
#   publish  the reusable
#   channel  moves the release channel `:stable`, which installed appliances
#            update from, to the published system image; nothing reaches an
#            appliance before its release is published
#
# When `vars.PORTFOLIO_APP_ID` is set, the reusable mints a short-lived
# GitHub-App installation token from `secrets.PORTFOLIO_APP_PRIVATE_KEY` and
# uses it for `gh release edit --draft=false`. App-authored release:published
# events cascade to release-cd-refresh-master.yml and
# release-cd-deliver-docs.yml; GITHUB_TOKEN-authored ones do not.

# Read-only floor; jobs declare what they need.
permissions:
  contents: read

# One release run per tag at a time, never cancelled in flight. The group name
# differs from the reusable's own group, so the two cannot block each other.
concurrency:
  group: release-publish-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Check the draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Draft releases are only visible to a token with write access.
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.check.outputs.commit }}
      build: ${{ steps.check.outputs.build }}
    steps:
      - name: Check ref, draft and attached assets
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          REF: ${{ github.ref }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$REF" != refs/heads/develop ]; then
            echo "::error::dispatch this workflow on develop, not on $REF"
            exit 1
          fi
          if [[ ! $TAG =~ ^[0-9A-Za-z._-]+$ ]]; then
            echo "::error::tag '$TAG' may only contain letters, digits, '.', '_' and '-'"
            exit 1
          fi
          if [ "$(gh release view "$TAG" --json isDraft -q .isDraft 2>/dev/null)" != true ]; then
            echo "::error::'$TAG' is not an open draft. Open drafts:"
            gh release list --limit 50 --json tagName,isDraft \
              --jq '.[] | select(.isDraft) | "  - " + .tagName' || true
            exit 1
          fi
          # The source-commit file is uploaded last, so its presence means the
          # uploads before it completed; every file SHA256SUMS lists must be
          # attached as well.
          source_asset="kamerplanter-appliance-$TAG-source-commit.txt"
          assets=$(gh release view "$TAG" --json assets -q '.assets[].name')
          complete() {
            grep -Fqx "$source_asset" <<<"$assets" && grep -Fqx SHA256SUMS <<<"$assets" || return 1
            [ "$(gh release download "$TAG" --pattern "$source_asset" --output -)" = "$COMMIT" ] || return 1
            grep -Fqx SHA256SUMS.sigstore.json <<<"$assets" || return 1
            local name
            for name in $(gh release download "$TAG" --pattern SHA256SUMS --output - | awk '{print $2}'); do
              grep -Fqx "$name" <<<"$assets" || return 1
              case $name in
                *.raw.xz) grep -Fqx "$name.sigstore.json" <<<"$assets" || return 1 ;;
              esac
            done
          }
          if [ -z "$assets" ]; then
            build=true
          elif complete; then
            echo "The draft already carries the complete image of $COMMIT; reusing it."
            build=false
          else
            echo "::error::the draft carries assets that are incomplete (for example unsigned) or were not built from $COMMIT; delete them from the draft and dispatch again"
            exit 1
          fi
          echo "commit=$COMMIT" >>"$GITHUB_OUTPUT"
          echo "build=$build" >>"$GITHUB_OUTPUT"

  disk:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    uses: ./.github/workflows/disk-image.yml
    with:
      version: ${{ inputs.tag }}
      ref: ${{ needs.prepare.outputs.commit }}
      # A dry run publishes nothing, also no system image.
      publish-image: ${{ !inputs.dry_run }}
    secrets:
      system-image-signing-key: ${{ secrets.SYSTEM_IMAGE_SIGNING_KEY }}
      system-image-signing-passphrase: ${{ secrets.SYSTEM_IMAGE_SIGNING_PASSPHRASE }}
    permissions:
      contents: read
      packages: write

  assets:
    name: Sign and attach disk image
    needs: [prepare, disk]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # id-token and attestations only here: this is the one job that signs.
    permissions:
      contents: write
      id-token: write
      attestations: write
      packages: write
    # Serialises two dispatches of the same tag without touching the
    # reusable's own group; an upload in flight is never cut off.
    concurrency:
      group: release-publish-assets-${{ inputs.tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.disk.outputs.artifact-name }}
          path: dist

      - name: Check the downloaded files and record their source
        working-directory: dist
        env:
          TAG: ${{ inputs.tag }}
          COMMIT: ${{ needs.prepare.outputs.commit }}
          DIGEST: ${{ needs.disk.outputs.image-digest }}
          IMAGE: ghcr.io/${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          sha256sum --check SHA256SUMS
          # The system image the disk was written from, which the release
          # channel moves to on publish.
          if [ "$DRY_RUN" != true ]; then
            [[ $DIGEST =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no system image digest from the disk job"; exit 1; }
            printf '%s:%s@%s\n' "$IMAGE" "$TAG" "$DIGEST" >"kamerplanter-appliance-$TAG-system-image.txt"
            sha256sum -- "kamerplanter-appliance-$TAG-system-image.txt" >>SHA256SUMS
          fi
          source_asset="kamerplanter-appliance-$TAG-source-commit.txt"
          printf '%s\n' "$COMMIT" >"$source_asset"
          sha256sum -- "$source_asset" >>SHA256SUMS
          ls -l

      # Installed in a dry run too, so the dry run exercises the installer.
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      # Checked again here, before signing: a signature is a permanent entry
      # in the public transparency log, and an image that current would
      # reject later must not get one.
      - name: Check develop has not moved before signing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          set -euo pipefail
          cosign version
          head=$(gh api "repos/$GH_REPO/git/ref/heads/develop" -q .object.sha)
          if [ "$head" != "$COMMIT" ]; then
            echo "::error::develop moved from $COMMIT to $head during the build; dispatch again"
            exit 1
          fi

      # Signing writes to the public transparency log, so a dry run, which
      # publishes nothing, does not sign.

      - name: Sign image and checksums
        if: ${{ !inputs.dry_run }}
        working-directory: dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: ghcr.io/${{ github.repository }}@${{ needs.disk.outputs.image-digest }}
        run: |
          set -euo pipefail
          for file in *.raw.xz SHA256SUMS; do
            cosign sign-blob --yes --bundle "$file.sigstore.json" "$file"
          done
          # The system image carries the update-key signature from the disk
          # job, which appliances check; this one is for checks from outside.
          cosign login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<<"$GH_TOKEN"
          cosign sign --yes "$REF"

      - name: Record build provenance
        if: ${{ !inputs.dry_run }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.raw.xz
            dist/SHA256SUMS

      # The same checks a user runs, before anything is attached.
      - name: Verify signatures and provenance
        if: ${{ !inputs.dry_run }}
        working-directory: dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release-publish.yml@refs/heads/develop
          REF: ghcr.io/${{ github.repository }}@${{ needs.disk.outputs.image-digest }}
        run: |
          set -euo pipefail
          cosign verify "$REF" --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null
          for file in *.raw.xz SHA256SUMS; do
            cosign verify-blob --bundle "$file.sigstore.json" \
              --certificate-identity "$IDENTITY" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "$file"
            gh attestation verify "$file" --repo "$GH_REPO" \
              --signer-workflow "$GH_REPO/.github/workflows/release-publish.yml" \
              --source-ref refs/heads/develop --deny-self-hosted-runners
          done

      # A dry run builds and checks the image but changes no release. prepare
      # has made sure the draft carries no assets, and the workflow-level
      # group keeps a second run of the same tag out, so nothing is replaced.
      - name: Attach to the draft release
        if: ${{ !inputs.dry_run }}
        working-directory: dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          source_asset="kamerplanter-appliance-$TAG-source-commit.txt"
          # The image and the checksums with their signature bundles first,
          # the source-commit file last: prepare treats that file as the sign
          # of a complete upload.
          for file in *.raw.xz *.raw.xz.sigstore.json *-system-image.txt SHA256SUMS SHA256SUMS.sigstore.json "$source_asset"; do
            gh release upload "$TAG" -- "$file"
          done
          attached=$(gh release view "$TAG" --json assets -q '.assets[].name')
          for file in *; do
            grep -Fqx "$file" <<<"$attached" || { echo "::error::$file is missing on $TAG"; exit 1; }
          done
          echo "$TAG carries:"
          echo "$attached"

  current:
    name: Check develop has not moved
    needs: [prepare, assets]
    # Either the image was attached in this run, or prepare found it complete
    # on the draft and skipped the build on purpose. A failed build also
    # leaves assets skipped, so that case is told apart by prepare's output.
    if: ${{ !cancelled() && needs.prepare.result == 'success' && (needs.assets.result == 'success' || (needs.assets.result == 'skipped' && needs.prepare.outputs.build == 'false')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Compare develop with the built commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          set -euo pipefail
          head=$(gh api "repos/$GH_REPO/git/ref/heads/develop" -q .object.sha)
          if [ "$head" != "$COMMIT" ]; then
            echo "::error::develop moved from $COMMIT to $head while the image was built; delete the assets from the draft and dispatch again"
            exit 1
          fi
          # A merge between this check and the reusable creating the tag on
          # develop is not caught; the window is the start-up time of the
          # publish job.

  publish:
    needs: current
    # Skipped jobs earlier in the chain (the reuse path) would otherwise skip
    # this job as well.
    if: ${{ !cancelled() && needs.current.result == 'success' }}
    uses: nolte/gh-plumbing/.github/workflows/reusable-release-publish.yml@9048eafc8665611b8109e8c5a519b78e0fceffa6 # v2.2.1
    with:
      tag: ${{ inputs.tag }}
      dry_run: ${{ inputs.dry_run }}
      app-id: ${{ vars.PORTFOLIO_APP_ID }}
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
      app-private-key: ${{ secrets.PORTFOLIO_APP_PRIVATE_KEY }}
    permissions:
      contents: write

  channel:
    name: Move the release channel
    needs: publish
    if: ${{ !cancelled() && needs.publish.result == 'success' && !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Point stable at the published system image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          set -euo pipefail
          # Appliances only move forward (spec/update-and-rollback/ A4): a
          # release published after a newer one leaves the channel alone.
          latest=$(gh release view --json tagName -q .tagName)
          if [ "$latest" != "$TAG" ]; then
            echo "::notice::$TAG is not the latest release ($latest); the channel stays where it is"
            exit 0
          fi
          ref=$(gh release download "$TAG" --pattern "kamerplanter-appliance-$TAG-system-image.txt" --output -)
          [[ $ref =~ ^$IMAGE:$TAG@sha256:[0-9a-f]{64}$ ]] || { echo "::error::unexpected system image reference '$ref'"; exit 1; }
          digest=${ref##*@}
          skopeo login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<<"$GH_TOKEN" >/dev/null
          # Signatures are stored per digest, so the channel tag carries them too.
          skopeo copy --preserve-digests --retry-times 3 "docker://$IMAGE@$digest" "docker://$IMAGE:stable"
          [ "$(skopeo inspect --raw "docker://$IMAGE:stable" | sha256sum | cut -d' ' -f1)" = "${digest#sha256:}" ] ||
            { echo "::error::$IMAGE:stable does not resolve to $digest"; exit 1; }
          echo "### \`$IMAGE:stable\` → $TAG (\`$digest\`)" >>"$GITHUB_STEP_SUMMARY"
