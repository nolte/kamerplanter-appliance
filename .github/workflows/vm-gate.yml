name: vm-gate

# Sets the commit status `vm-gate`, a required check on develop
# (.github/settings.yml), on the head of every pull request (#43):
#   success  the pull request changes nothing the VM tests cover;
#   failure  it changes what they cover but lacks the label `vm-tests`, or a
#            push has withdrawn the label, or the label was set too soon
#            after a push (both below);
#   pending  it has the label, and the label covers this head:
#            vm-gate-finalize.yml sets the result once the vm-tests run of
#            that commit has completed (#51). A fork's run that awaits
#            approval has not completed, so vm-gate stays pending until a
#            maintainer approves it.
# The VM tests cover the image, the build, the boot and image tests and
# vm-tests.yml, and the two gate workflows count as well: a change to
# vm-gate.yml or vm-gate-finalize.yml takes effect only once it is on
# develop, and counting them keeps a change to the gate behind the label.
#
# The label is read from the API when the job runs, not from the event
# (#145): the event of `opened` is from before `gh pr create --label` set the
# label, and decided failure on a pull request that did nothing wrong.
#
# The label is the consent to running the pull request's own vm-tests.yml
# and scripts and to trusting their result: someone with triage access sets
# it, or Renovate on its own fedora base pull requests (renovate.json5). It
# names no commit, so a push withdraws it (#130): on `synchronize`, a label
# that was there when the push arrived is removed, and vm-gate fails until
# it is set again, when
#   - the head is in a fork;
#   - the push changes what the VM jobs run, in the pull request's own
#     version: vm-tests.yml, build/, tests/boot/ and tests/image/ as the
#     pull request changes them against develop, before and after the push,
#     by content and by file mode (a `chmod +x` is a change).
#     A rebase or a merge of develop that leaves the pull request's own
#     changes to these paths as they were keeps the label; a comparison
#     that fails (the commit before a force push is gone), lists 300
#     files or meets a truncated tree counts as a change;
#   - the commit before the push was not accepted here: it has no vm-gate
#     status, or one that says the label is missing. GitHub keeps one
#     waiting run per concurrency group, so the run of an earlier push can
#     have been dropped; this push then cannot vouch for what that one
#     brought, and a pull request that was closed, pushed to and reopened
#     arrives the same way.
# A push that changes only other paths (image/, the documentation) keeps the
# label. Removing the label with GITHUB_TOKEN starts no workflow, so this
# job sets the failure itself; setting the label again fires `labeled`,
# which starts the VM tests of the head and sets pending here. The run of
# vm-tests.yml that the push itself started ends in its first job, which
# finds the label removed (#152), unless the pull request has rewritten
# that job; either way vm-gate-finalize.yml writes a result only on a
# commit that this workflow accepted (pending or green, or one that already
# has a result of its VM tests) and while the label is set. Running a
# push's run of this workflow again repeats the withdrawal,
# also after the label was set again: set the label instead.
#
# A label that is set after the head arrived covers that head only when the
# one who set it can have seen it (#151): a maintainer reads commit A and
# sets the label, and a push that arrived a moment before has made B the
# head the label's event names. So on `labeled`, on `opened` and on a
# `synchronize` whose event did not hold the label yet, the head gets
# pending only if
#   - it has been the tip of the head branch, and the pull request open
#     since it was last reopened, for the grace time (5 minutes) when the
#     label was set, or
#   - the head is in this repository and the one who set the label is the
#     one who pushed it: Renovate on its own pull requests, and whoever
#     opens a pull request with `gh pr create --label vm-tests` right
#     after the push. Not for a head in a fork: there the fork's owner
#     decides which account pushes.
# Otherwise the label is removed again and vm-gate fails with "the label was
# set less than 5 minutes after a push or a reopening": look at the head
# again and set the label again, which counts once the head is 5 minutes
# old. The status stays when the other of the two runs (the push's and the
# label's) finds no label afterwards. Both times and both accounts are
# GitHub's own records, none of them the commit's: the newest `labeled`
# event of vm-tests and the newest `reopened` event in the pull request's
# events (pull-requests: read), and the newest entry of the head branch in
# the activity of the head repository (contents: read; public for a fork),
# which must name this commit as what the branch points to since then. The
# head repository is asked for by its id, as the pull request has it when
# the job runs: a name can be given to another repository after the event.
# A commit's author, committer and dates are the pusher's to choose and are
# not read. A record that cannot be read, or that does not name this head
# after three readings, counts as too new. What the grace time cannot see:
# a page that was loaded more than 5 minutes before the click and never
# refreshed; a head the one who set the label pushed without reading what
# it merged (the button "Update branch"); and a label that was set so soon
# after a push that the push's own event already holds it (GitHub builds
# the event a moment after the push). That push counts as one that found
# the label set: from a fork it loses the label anyway, but a push to a
# branch of this repository that changes only the image, onto an accepted
# commit, gets pending from its own run. The label's run then takes it
# back, unless it is replaced as the waiting run (the pull request closed
# and reopened at once: the run of `reopened` finds pending and leaves
# it). Whoever can push to a branch here could set the label as well, so
# this is a gap against a mistake, not a way in.
#
# What this protects is the result, not the run: vm-tests.yml starts on the
# `labeled` event with the label its event holds. Its first job reads the
# label and this status again and ends the run of a head whose label is
# taken back here (#152), but it is the pull request's own version of that
# job, so a pull request that rewrites it still runs that head's code once.
# And it decides once, on the status it finds: in the gap above (the push's
# event already holds the label, pending from the push's run, taken back by
# the label's run) it has seen pending and lets the suites run that head to
# the end (#180).
# The result of such a run does not count. That job reads vm-gate's
# status by its text: it runs on pending and green from here and on a
# result that vm-gate-finalize.yml wrote, the same three as accepted()
# below and as vm-gate-finalize.yml, and it gives up at once on "it is not
# the head of the pull request any more" (tests/unit/workflows.sh keeps
# these texts in step).
#
# pull_request_target: the gate runs as develop has it, so a pull request
# cannot rewrite the gate it is judged by. That is safe here because only the
# GitHub API is read; the pull request's code is never checked out.
# pull-requests: write is for removing the label and nothing else;
# tests/unit/workflows.sh keeps this the only workflow that removes it and
# checks that none sets it, and tests/unit/vm-gate.sh runs the script below
# against a stub of gh.

on:
  pull_request_target:
    branches: [develop]
    types: [opened, reopened, synchronize, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write
  statuses: write

# One run at a time per pull request, in the order of the events, so that
# an older decision never overwrites a newer one. A waiting run is replaced
# by a newer event's run: every run therefore decides from the state it
# finds. A dropped run leaves its head without a status, or with the one
# an earlier run wrote; only `opened`, `synchronize` and the label's own
# `labeled` event ever set pending, so no later event accepts that head.
# The run of a push and the run of a label that was set right after it can
# come in either order, or the push's run is the one dropped. If the
# push's event did not hold the label, whichever of them finds it reads
# the same records (#151) and decides the same, and the one that comes
# after a removal finds no label and leaves the status that says why. If
# the push's event already held the label (it can, for a label set a
# second after the push), the push's run applies the rules of #130 alone
# and the two can differ: pending from the push's run stands until the
# label's run takes it back, and for good if that run is dropped (the
# header names this as what remains).
concurrency:
  group: vm-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  gate:
    name: vm-gate-decision
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      NUMBER: ${{ github.event.pull_request.number }}
      SHA: ${{ github.event.pull_request.head.sha }}
      BASE: ${{ github.event.pull_request.base.sha }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
      # The pull request's to choose: only ever a value of a request, below.
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      BEFORE: ${{ github.event.before }}
      ACTION: ${{ github.event.action }}
      LABEL: ${{ github.event.label.name }}
      # Only for a push: whether the label was there when it arrived. The
      # decision itself takes the label from the API.
      LABEL_AT_EVENT: ${{ contains(github.event.pull_request.labels.*.name, 'vm-tests') }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Set the vm-gate status
        run: |
          set -euo pipefail
          status() {
            gh api -X POST "repos/$REPO/statuses/$SHA" -f context=vm-gate \
              -f state="$1" -f description="$2" -f target_url="$RUN_URL" >/dev/null
            echo "vm-gate: $1 ($2)"
          }
          # Whether the pull request has the label right now.
          labelled() {
            gh api "repos/$REPO/issues/$NUMBER/labels?per_page=100" --jq '[.[].name] | index("vm-tests") != null'
          }
          # The newest vm-gate status of a commit as "state<TAB>description";
          # nothing if it has none. Every page of the list, newest first:
          # the status can sit behind 100 newer ones of other contexts.
          latest() {
            gh api --paginate "repos/$REPO/commits/$1/statuses?per_page=100" |
              jq -rs '[.[][] | select(.context == "vm-gate")] | first | if . == null then empty else "\(.state)\t\(.description // "")" end'
          }
          # A commit this workflow accepted for the VM tests: vm-gate is
          # pending or green on it, or vm-gate-finalize.yml has written the
          # result of its VM tests. Not accepted: no status, or a failure
          # from here (the label is missing, or there is no result).
          accepted() {
            case $1 in
              pending$'\t'* | success$'\t'* | failure$'\t''the VM tests of this commit'*) return 0 ;;
              *) return 1 ;;
            esac
          }
          # What the VM jobs run, in the pull request's own version at a
          # commit: the files it changes against the base branch (from the
          # merge base, so a newer develop adds nothing) under the paths the
          # jobs execute, each with the content and the file mode it has,
          # one JSON line per file (a file name can hold a line break). The
          # comparison names no mode (a file whose mode alone differs from
          # the base is listed, with no blob; a `chmod +x` on a file the
          # pull request already changes leaves its entry as it was), so
          # the mode comes from the commit's tree; a file that is gone has
          # none.
          own() {
            local out files modes
            out=$(gh api "repos/$REPO/compare/$BASE_REF...$1" --jq '(.files | length),
              (.files[] | select([.filename, .previous_filename // ""]
                | any(test("^(build/|tests/boot/|tests/image/|\\.github/workflows/vm-tests\\.yml$)")))
              | [.status, .previous_filename, .filename, .sha] | tojson)') || return 1
            [ "$(head -n1 <<<"$out")" -lt 300 ] || return 1
            files=$(tail -n +2 <<<"$out")
            [ -n "$files" ] || return 0
            modes=$(gh api "repos/$REPO/git/trees/$1?recursive=1" --jq '.truncated,
              ([.tree[] | select(.path
                | test("^(build/|tests/boot/|tests/image/|\\.github/workflows/vm-tests\\.yml$)"))
                | {key: .path, value: .mode}] | from_entries | tojson)') || return 1
            [ "$(head -n1 <<<"$modes")" = false ] || return 1
            jq -c --argjson modes "$(tail -n +2 <<<"$modes")" '. + [$modes[.[2]]]' <<<"$files" | sort
          }

          # Takes the label away for the reason $1. The label first, the
          # status after it (the caller sets it): vm-gate-finalize.yml
          # checks the label right before it writes.
          withdraw() {
            gh api -X DELETE "repos/$REPO/issues/$NUMBER/labels/vm-tests" >/dev/null || true
            has_label=$(labelled)
            if [ "$has_label" = true ]; then
              status failure "$1: the label vm-tests could not be removed, remove it by hand"
              exit 1
            fi
            echo "vm-gate: removed the label vm-tests from #$NUMBER ($1)"
          }
          # Whether a label that was set after this head arrived covers it
          # (#151): the head was the tip of its branch, and the pull request
          # open, for the grace time when the label was set, or the head is
          # in this repository and the one who set the label pushed it. If
          # not, $late says why. The label's time and account are those of
          # the newest `labeled` event of vm-tests, on whichever page of the
          # events it is; the push's are those of the newest entry of the
          # head branch in the activity of the head repository $head_repo
          # (its id), which counts only if it names this commit as the tip.
          # An account that is gone (null) equals no other. One reading:
          grace=300
          unread="the time of the push or of the label could not be read"
          measured() {
            local label push label_at reopened_at label_by push_at push_by
            late=$unread
            [ -n "$head_repo" ] || return 1
            label=$(gh api --paginate "repos/$REPO/issues/$NUMBER/events?per_page=100" |
              jq -rs '[.[][]] | ([.[] | select(.event == "labeled" and .label.name == "vm-tests")] | last) as $set
                | ([.[] | select(.event == "reopened")] | last) as $back
                | if $set == null then empty else [($set.created_at | fromdateiso8601),
                    (if $back == null then 0 else $back.created_at | fromdateiso8601 end),
                    ($set.actor.id // "")] | @tsv end') || return 1
            push=$(gh api -X GET "repositories/$head_repo/activity" -f ref="refs/heads/$HEAD_REF" -f per_page=1 |
              jq -r --arg ref "refs/heads/$HEAD_REF" --arg sha "$SHA" '.[0] | select(.ref == $ref and .after == $sha)
                | [(.timestamp | fromdateiso8601), (.actor.id // "")] | @tsv') || return 1
            # The field that can be empty is the last one of each line.
            IFS=$'\t' read -r label_at reopened_at label_by <<<"$label"
            IFS=$'\t' read -r push_at push_by <<<"$push"
            [ -n "$label_at" ] && [ -n "$push_at" ] || return 1
            if [ "$head_repo" = "$base_repo" ] && [ -n "$label_by" ] && [ "$label_by" = "$push_by" ]; then
              return 0
            fi
            # A head that was pushed while the pull request was closed
            # shows since the pull request was reopened.
            [ "$reopened_at" -le "$push_at" ] || push_at=$reopened_at
            [ $((label_at - push_at)) -lt "$grace" ] || return 0
            late="the label was set less than $((grace / 60)) minutes after a push or a reopening"
            return 1
          }
          # Three readings, a pause between them, when a record is missing or
          # does not name this head yet: the run of `opened` can be faster
          # than the lists (the unit test sets the pause to 0).
          timely() {
            local try
            for try in 1 2 3; do
              ! measured || return 0
              [ "$late" = "$unread" ] && [ "$try" != 3 ] || return 1
              sleep "${VM_GATE_PAUSE:-5}"
            done
          }

          has_label=$(labelled)
          # Whether a push found the label set, by its event.
          at_push=false
          [ "$ACTION" != synchronize ] || [ "$LABEL_AT_EVENT" != true ] || at_push=true

          # A push withdraws the consent the label stands for (#130). A label
          # that was set after the push arrived is for the grace time below.
          withdrawn=
          if [ "$at_push" = true ] && [ "$has_label" = true ]; then
            if [ "$HEAD_REPO" != "$REPO" ]; then
              withdrawn="a push from a fork"
            elif ! accepted "$(latest "$BEFORE" 2>/dev/null || true)"; then
              withdrawn="a push onto a commit vm-gate had not accepted"
            elif ! is=$(own "$SHA") || ! was=$(own "$BEFORE") || [ "$is" != "$was" ]; then
              withdrawn="a push that changes what the VM tests run"
            fi
            [ -z "$withdrawn" ] || withdraw "$withdrawn"
          fi

          # The files of exactly this head, not of whatever the pull request
          # shows by now. The comparison lists at most 300 files; a larger
          # change counts as covered.
          # A file moved out of a covered path counts by its old name.
          files=$(gh api "repos/$REPO/compare/$BASE...$SHA" \
            --jq '.files | length, (.[] | .filename, (.previous_filename // empty) | tojson)')
          covered=$(tail -n +2 <<<"$files" |
            grep -cE '^"(image/|build/|tests/boot/|tests/image/|\.github/workflows/vm-(tests|gate|gate-finalize)\.yml")' || true)
          [ "$(head -n1 <<<"$files")" -lt 300 ] || covered=many
          if [ "$covered" = 0 ]; then
            status success "no change the VM tests cover"
          elif [ -n "$withdrawn" ]; then
            status failure "$withdrawn: the label vm-tests was removed, add the label vm-tests again after review"
          elif [ "$has_label" != true ]; then
            # A status that says why the label was removed stays: of the
            # push's run and the label's, the second one finds no label
            # after the first one took it away (#151).
            case $(latest "$SHA") in
              failure$'\t'*': the label vm-tests was removed, add the label vm-tests again after review')
                echo "vm-gate: unchanged (the status says why the label was removed)" ;;
              *)
                status failure "changes the image, build or boot tests: add the label vm-tests" ;;
            esac
          elif [ "$ACTION" = opened ] || [ "$ACTION" = synchronize ] ||
            { [ "$ACTION" = labeled ] && [ "$LABEL" = vm-tests ]; }; then
            # A new head or the label just set: the VM tests start now, and
            # vm-gate-finalize.yml sets the result when they have completed.
            # Only for the commit that is the head right now: a run that
            # waited while the head moved on reads a label that was set on
            # another commit, and pending here would accept this one.
            # The repositories by their ids, the head's last: it is gone
            # (empty) when the fork was deleted.
            now=$(gh api "repos/$REPO/pulls/$NUMBER" --jq '[.head.sha, .base.repo.id, (.head.repo.id // "")] | @tsv')
            IFS=$'\t' read -r head base_repo head_repo <<<"$now"
            if [ "$head" != "$SHA" ]; then
              status failure "no VM test result for this commit: it is not the head of the pull request any more"
            elif [ "$at_push" != true ] && ! timely; then
              # The label was set after this head arrived, and too soon
              # after it for the one who set it to have seen this head
              # (#151). A label the push found set has passed the rules
              # above instead.
              withdraw "$late"
              status failure "$late: the label vm-tests was removed, add the label vm-tests again after review"
            else
              status pending "waiting for the VM tests of this commit (vm-gate-finalize sets the result)"
            fi
          else
            # Reopened, or another label changed: nothing starts the VM tests
            # now, and this event says nothing about which head the label
            # was set on. An old status is no ground for pending: the commit
            # can have become the head again by a push whose own run was
            # dropped, and a bot's label is an event the author can cause.
            if accepted "$(latest "$SHA")"; then
              # vm-tests.yml tests nothing new, so what vm-gate says for
              # this head stands.
              echo "vm-gate: unchanged"
            else
              # No result for this head: it was never accepted (pushed to
              # while the pull request was closed, or the run of the event
              # that brought it or the label was dropped).
              status failure "no VM test result for this commit: remove the label vm-tests and set it again"
            fi
          fi
