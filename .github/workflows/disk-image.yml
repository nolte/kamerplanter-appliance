name: disk-image

# Builds the raw disk image of the appliance and keeps it as a workflow
# artifact. It is the build half of the release process in
# spec/release-distribution/: a release workflow calls it, then signs the
# result and attaches it to the release. Until that exists it runs on its own,
# so a change to the image is proven to produce a bootable artifact before it
# lands on develop.
#
# The steps are the same scripts `task disk:build` and `task disk:package`
# run locally, minus the tool container: the runner already has podman, and
# the disk build needs root for its loop devices.

on:
  workflow_call:
    inputs:
      version:
        description: "Version for the artifact names; defaults to the short commit SHA."
        required: false
        type: string
        default: ''
      ref:
        description: "Commit to build; defaults to the commit that triggered the run."
        required: false
        type: string
        default: ''
    outputs:
      artifact-name:
        description: "Name of the uploaded workflow artifact."
        value: ${{ jobs.disk.outputs.artifact-name }}
  workflow_dispatch:
    inputs:
      version:
        description: "Version for the artifact names; defaults to the short commit SHA."
        required: false
        type: string
        default: ''
  push:
    branches: [develop]
    paths:
      - 'image/**'
      - 'build/**'
      - '.github/workflows/disk-image.yml'
  pull_request:
    branches: [develop]
    paths:
      - 'image/**'
      - 'build/**'
      - '.github/workflows/disk-image.yml'

permissions:
  contents: read

# A newer push or pull-request update supersedes an older build of the same
# ref. A run called by the release workflow carries the caller's event name
# (workflow_dispatch) and its version in the group, so it never shares a group
# with a push, a pull request or a release of another tag, and it is never
# cancelled in flight.
concurrency:
  group: disk-image-${{ github.event_name }}-${{ github.ref }}-${{ inputs.version || 'snapshot' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  disk:
    name: disk-image
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      artifact-name: ${{ steps.meta.outputs.artifact }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}

      - name: Determine version and artifact name
        id: meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
          # On a pull request GITHUB_SHA is a temporary merge commit; name the
          # artifact after the commit the pull request actually holds.
          COMMIT: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
        run: |
          version=${INPUT_VERSION:-${COMMIT::12}}
          # The version becomes part of file and artifact names.
          if [[ ! $version =~ ^[0-9A-Za-z._-]+$ ]]; then
            echo "::error::version '$version' may only contain letters, digits, '.', '_' and '-'"
            exit 1
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "artifact=kamerplanter-appliance-$version" >>"$GITHUB_OUTPUT"

      # The first run needed about 5 GB of the 106 GB a runner leaves free,
      # so no cleanup step is needed.
      - name: Disk before the run
        run: df -h /

      - name: Build the system image
        run: sudo podman build -t localhost/kamerplanter-appliance:ci image

      - name: Build the raw disk image
        run: sudo build/disk.sh localhost/kamerplanter-appliance:ci

      - name: Package the disk image
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: sudo build/package.sh "$VERSION"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.meta.outputs.artifact }}
          path: .build/dist/
          if-no-files-found: error
          # Already xz-compressed; a second pass only costs time.
          compression-level: 0
          retention-days: 14

      - name: Disk after the run
        if: always()
        run: df -h /
