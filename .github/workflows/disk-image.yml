name: disk-image

# Builds the raw disk image of the appliance and keeps it as a workflow
# artifact. It is the build half of the release process in
# spec/release-distribution/: a release workflow calls it, then signs the
# result and attaches it to the release. Until that exists it runs on its own,
# so a change to the image is proven to produce a bootable artifact before it
# lands on develop.
#
# The steps are the same scripts `task disk:build` and `task disk:package`
# run locally, minus the tool container: the runner already has podman, and
# the disk build needs root for its loop devices.
#
# With `publish-image`, the release workflow's case, the system image is
# pushed to ghcr.io under the version, signed with the update key that every
# appliance trusts (spec/update-and-rollback/ B3), checked against the public
# key built into the image, and the disk is written from the pushed image. An
# installed appliance then runs exactly the digest the registry serves.

on:
  workflow_call:
    inputs:
      version:
        description: "Version for the artifact names; defaults to the short commit SHA."
        required: false
        type: string
        default: ''
      ref:
        description: "Commit to build; defaults to the commit that triggered the run."
        required: false
        type: string
        default: ''
      publish-image:
        description: "Push the signed system image to ghcr.io and build the disk from it."
        required: false
        type: boolean
        default: false
    secrets:
      system-image-signing-key:
        description: "Sigstore private key that signs the system image (publish-image only)."
        required: false
      system-image-signing-passphrase:
        description: "Passphrase of that key."
        required: false
    outputs:
      artifact-name:
        description: "Name of the uploaded workflow artifact."
        value: ${{ jobs.disk.outputs.artifact-name }}
      image-digest:
        description: "Digest of the pushed system image (publish-image only)."
        value: ${{ jobs.disk.outputs.image-digest }}
  workflow_dispatch:
    inputs:
      version:
        description: "Version for the artifact names; defaults to the short commit SHA."
        required: false
        type: string
        default: ''
  push:
    branches: [develop]
    paths:
      - 'image/**'
      - 'build/**'
      - '.github/workflows/disk-image.yml'
  pull_request:
    branches: [develop]
    paths:
      - 'image/**'
      - 'build/**'
      - '.github/workflows/disk-image.yml'

permissions:
  contents: read

# A newer push or pull-request update supersedes an older build of the same
# ref. A run called by the release workflow carries the caller's event name
# (workflow_dispatch) and its version in the group, so it never shares a group
# with a push, a pull request or a release of another tag, and it is never
# cancelled in flight. (GitHub still drops a pending run when a third one
# queues into the same group; release-publish.yml allows one run per tag.)
concurrency:
  group: disk-image-${{ github.event_name }}-${{ github.ref }}-${{ inputs.version || 'snapshot' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  disk:
    name: disk-image
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # packages: write is used only with publish-image; a pull request from a
    # fork gets a read-only token whatever is declared here.
    permissions:
      contents: read
      packages: write
    outputs:
      artifact-name: ${{ steps.meta.outputs.artifact }}
      image-digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}

      - name: Determine version and artifact name
        id: meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
          # On a pull request GITHUB_SHA is a temporary merge commit; name the
          # artifact after the commit the pull request actually holds.
          COMMIT: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
        run: |
          version=${INPUT_VERSION:-${COMMIT::12}}
          # The version becomes part of file and artifact names.
          if [[ ! $version =~ ^[0-9A-Za-z._-]+$ ]]; then
            echo "::error::version '$version' may only contain letters, digits, '.', '_' and '-'"
            exit 1
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "artifact=kamerplanter-appliance-$version" >>"$GITHUB_OUTPUT"

      # The first run needed about 5 GB of the 106 GB a runner leaves free,
      # so no cleanup step is needed.
      - name: Disk before the run
        run: df -h /

      - name: Build the system image
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          # Label the commit that is built: on a pull request that is the
          # checked-out merge commit, not the head commit the version names.
          revision=$(git rev-parse HEAD)
          created=$(TZ=UTC0 git show -s --date=format-local:%Y-%m-%dT%H:%M:%SZ --format=%cd HEAD)
          # The manifest inherits the base image's version and creation
          # annotations; set them to the labels' values.
          sudo podman build \
            --build-arg VERSION="$VERSION" --build-arg REVISION="$revision" --build-arg CREATED="$created" \
            --annotation org.opencontainers.image.version="$VERSION" \
            --annotation org.opencontainers.image.revision="$revision" \
            --annotation org.opencontainers.image.created="$created" \
            -t localhost/kamerplanter-appliance:ci image
          for key in version revision created; do
            label=$(sudo podman image inspect localhost/kamerplanter-appliance:ci \
              --format "{{index .Labels \"org.opencontainers.image.$key\"}}")
            annotation=$(sudo podman image inspect localhost/kamerplanter-appliance:ci \
              --format "{{index .Annotations \"org.opencontainers.image.$key\"}}")
            [ -n "$label" ] && [ "$label" = "$annotation" ] ||
              { echo "::error::$key: label '$label', annotation '$annotation'"; exit 1; }
          done

      - name: Push and sign the system image
        id: push
        if: inputs.publish-image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGNING_KEY: ${{ secrets.system-image-signing-key }}
          SIGNING_PASSPHRASE: ${{ secrets.system-image-signing-passphrase }}
          IMAGE: ghcr.io/${{ github.repository }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "$SIGNING_KEY" ] || [ -z "$SIGNING_PASSPHRASE" ]; then
            echo "::error::publish-image needs the secrets SYSTEM_IMAGE_SIGNING_KEY and SYSTEM_IMAGE_SIGNING_PASSPHRASE"
            exit 1
          fi
          keys=$(mktemp -d "$RUNNER_TEMP/keys.XXXXXX")
          trap 'sudo rm -rf "$keys"' EXIT
          (umask 077; printf '%s\n' "$SIGNING_KEY" >"$keys/key"; printf '%s' "$SIGNING_PASSPHRASE" >"$keys/pass")
          # Signatures go next to the image, where the appliance looks for them.
          sudo install -D -m 0644 image/rootfs/usr/share/containers/registries.d/kamerplanter-appliance.yaml \
            /etc/containers/registries.d/kamerplanter-appliance.yaml
          sudo podman login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<<"$GH_TOKEN" >/dev/null
          # Through an OCI layout: layers that container storage cannot
          # reproduce byte for byte cannot be signed on their way out of it.
          sudo podman push --remove-signatures localhost/kamerplanter-appliance:ci "oci:$keys/oci"
          sudo skopeo copy --retry-times 3 --authfile /run/containers/0/auth.json --digestfile "$keys/digest" \
            --sign-by-sigstore-private-key "$keys/key" --sign-passphrase-file "$keys/pass" \
            "oci:$keys/oci" "docker://$IMAGE:$VERSION"
          digest=$(cat "$keys/digest")
          echo "digest=$digest" >>"$GITHUB_OUTPUT"
          echo "ref=$IMAGE@$digest" >>"$GITHUB_OUTPUT"
          echo "Pushed $IMAGE:$VERSION as $digest"

      # The pull is checked against the public key the image ships, under the
      # same policy an appliance applies: a secret that does not match it would
      # publish an update no appliance accepts.
      - name: Pull the pushed image as an appliance would
        if: inputs.publish-image
        env:
          REF: ${{ steps.push.outputs.ref }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          set -euo pipefail
          policy=$(mktemp "$RUNNER_TEMP/policy.XXXXXX")
          key=$(mktemp "$RUNNER_TEMP/key.XXXXXX")
          sudo podman run --rm --entrypoint cat localhost/kamerplanter-appliance:ci \
            /usr/share/kamerplanter/keys/system-image.pub >"$key"
          jq -n --arg image "$IMAGE" --arg key "$key" '{
            default: [{type: "reject"}],
            transports: {docker: {($image): [{type: "sigstoreSigned", keyPath: $key,
              signedIdentity: {type: "matchRepository"}}]}}}' >"$policy"
          sudo podman rmi --force "$REF" >/dev/null 2>&1 || true
          sudo podman pull --signature-policy "$policy" "$REF"

      - name: Build the raw disk image
        env:
          REF: ${{ steps.push.outputs.ref || 'localhost/kamerplanter-appliance:ci' }}
        run: sudo build/disk.sh "$REF"

      - name: Package the disk image
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: sudo build/package.sh "$VERSION"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.meta.outputs.artifact }}
          path: .build/dist/
          if-no-files-found: error
          # Already xz-compressed; a second pass only costs time.
          compression-level: 0
          retention-days: 14

      - name: Disk after the run
        if: always()
        run: df -h /
