on:
  pull_request:
    types:
      - labeled
      - unlabeled
      - synchronize
      - opened
      - edited
      - ready_for_review
      - reopened
      - unlocked
  pull_request_review:
    types:
      - submitted
  check_suite:
    types:
      - completed
  status: {}

jobs:
  automerge:
    uses: nolte/gh-plumbing/.github/workflows/reusable-automerge.yaml@9048eafc8665611b8109e8c5a519b78e0fceffa6 # v2.2.1
    with:
      # Mint a portfolio-App token so the action's branch auto-updates are
      # pushed under the App identity. Pushes made with GITHUB_TOKEN do not
      # trigger workflows (GitHub's recursion guard), which leaves branch
      # auto-updates without any status checks.
      app-id: ${{ vars.PORTFOLIO_APP_ID }}
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
      app-private-key: ${{ secrets.PORTFOLIO_APP_PRIVATE_KEY }}
    permissions:
      contents: write
      pull-requests: write
