on:
  pull_request:
    types:
      - labeled
      - unlabeled
      - synchronize
      - opened
      - edited
      - ready_for_review
      - reopened
      - unlocked
  pull_request_review:
    types:
      - submitted
  check_suite:
    types:
      - completed
  status: {}
  # The workflows that set the required checks of develop
  # (.github/settings.yml): ci (docs-build, pre-commit, unit-tests) and
  # vm-gate (the commit status vm-gate). They set them with GITHUB_TOKEN,
  # whose events (the `status` of vm-gate, the `check_suite` of the run)
  # start no workflow, so a pull request whose last check turned green after
  # the last automerge run stayed open (#70). A `workflow_run` event starts a
  # run even then, and pascalgn/automerge-action finds the pull request from
  # its payload. vm-gate-finalize sets the result of the VM tests into
  # vm-gate; it runs on workflow_run itself, so its own run names no pull
  # request, and it calls the same reusable workflow after setting a green
  # vm-gate instead of being listed here (#51). tests/unit/workflows.sh keeps
  # this list in step with the workflows that set a required check.
  workflow_run:
    workflows: [ci, vm-gate]
    types: [completed]

# No concurrency group: GitHub keeps one pending run per group, so a newer
# event (a status, which has no branch, or a skipped workflow_run) would
# replace a pending evaluation of another pull request or a successful one.
# Two evaluations of one branch at once do no harm: the second finds the
# pull request merged, or its update or merge is refused for a moved head.

jobs:
  automerge:
    # A run of these workflows on a push to develop or by hand has no pull
    # request to merge.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.event == 'pull_request' ||
      github.event.workflow_run.event == 'pull_request_target'
    uses: nolte/gh-plumbing/.github/workflows/reusable-automerge.yaml@d664e75afc4d57de958af926987f842c1fc1f420 # v2.3.1
    with:
      # Mint a portfolio-App token so the action's branch auto-updates are
      # pushed under the App identity. Pushes made with GITHUB_TOKEN do not
      # trigger workflows (GitHub's recursion guard), which leaves branch
      # auto-updates without any status checks.
      app-id: ${{ vars.PORTFOLIO_APP_ID }}
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
      app-private-key: ${{ secrets.PORTFOLIO_APP_PRIVATE_KEY }}
    permissions:
      contents: write
      pull-requests: write
