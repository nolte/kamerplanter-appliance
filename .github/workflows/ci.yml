name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The system image is built by disk-image.yml, which runs on every change
  # under image/ and build/ and turns the image into the disk image as well.
  docs:
    # Job names are the status-check contexts `.github/settings.yml` declares
    # under `branches[develop].required_status_checks`. Kept free of spaces;
    # renaming a job renames its context and silently drops it from the
    # required set — change both files together.
    name: docs-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.14'

      - name: Install the docs toolchain
        run: pip install -r docs/requirements.txt

      # Same command `task docs` runs locally, so a local pass matches CI.
      - name: Build the site
        run: mkdocs build --strict

  lint:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.14'

      - name: Install the tooling install set
        run: pip install -r requirements-dev.txt

      - name: Run every hook
        run: pre-commit run --all-files --show-diff-on-failure

  unit:
    # The shell unit tests of tests/unit/: the image's scripts as they ship,
    # in a sandbox with stubs (tests/unit/lib/sandbox.sh); no root, no VM.
    # A required check on develop (.github/settings.yml), since #42.
    name: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # What the image's scripts use besides bash: PyYAML (scrub-cloud-init
      # reads cloud-init's copies with it, as cloud-init does), and the
      # compressors the scrub tests build rotated logs with.
      - name: Install the tools the tests use
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends python3-yaml xz-utils bzip2 jq

      - name: Run every unit test
        run: |
          status=0
          for test in tests/unit/*.sh; do
            echo "::group::$test"
            bash "$test" || status=1
            echo "::endgroup::"
          done
          exit "$status"
